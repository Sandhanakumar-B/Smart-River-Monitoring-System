# =============================================================================
# Smart River Monitoring System — GitHub Actions CI/CD Pipeline
# Day 19: Docker Containerization & Deployment  
# Syllabus Unit: UNIT V - Continuous Integration, Automated Testing, Build Pipeline
# =============================================================================
#
# Pipeline Stages:
#   1. test    — JUnit 5 unit tests with Maven Surefire
#   2. build   — Compile, package, verify Spring Boot JAR
#   3. docker  — Build Docker image and push to GitHub Container Registry
#
# Triggers: every push to main/develop branch + every Pull Request
# =============================================================================

name: Smart River CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/smart-river-system

jobs:
  # ── Stage 1: Unit Tests ────────────────────────────────────────────────────
  test:
    name: JUnit 5 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run JUnit 5 test suite
        run: mvn test --batch-mode -Dspring.profiles.active=test

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit

  # ── Stage 2: Build & Package ───────────────────────────────────────────────
  build:
    name: Maven Build & Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot JAR
        run: mvn package -DskipTests --batch-mode

      - name: Verify JAR artifact
        run: ls -lh target/*.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-river-jar
          path: target/*.jar
          retention-days: 7

  # ── Stage 3: Docker Image ──────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
