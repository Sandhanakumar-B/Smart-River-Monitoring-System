# ====================================================================
# Smart River Management System - Application Configuration
# Day 14: Spring Data JPA & H2 Embedded Database
# ====================================================================

# ---- H2 Embedded Database (file-based, persists between restarts) ----
spring.datasource.url=jdbc:h2:file:./data/riverdb_jpa;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- Hibernate JPA Configuration ----
# Hibernate auto-detects H2Dialect automatically
# update = creates tables on first run, migrates schema on subsequent runs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- H2 Web Console (accessible at http://localhost:8080/h2-console) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ---- Server ----
server.port=8080
